<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">상품 정보 품질의 순환</title><desc id="desc">상품 원장, 옵션별 데이터, AI 노출, 고객 확인, 오류 수정의 순환이다.</desc>
<rect width="1200" height="360" rx="24" fill="#f3f8f4"/><text x="50" y="55" font-size="30" font-family="sans-serif" font-weight="700" fill="#235238">AI가 믿고 읽을 수 있는 상품 정보</text>
<g font-family="sans-serif" text-anchor="middle" fill="#235238"><rect x="55" y="105" width="190" height="100" rx="17" fill="#dcefe2"/><text x="150" y="146" font-size="23">상품 원장</text><text x="150" y="178" font-size="17">기준 정보</text><rect x="280" y="105" width="190" height="100" rx="17" fill="#dcefe2"/><text x="375" y="146" font-size="23">옵션별 정보</text><text x="375" y="178" font-size="17">사진·가격·재고</text><rect x="505" y="105" width="190" height="100" rx="17" fill="#dcefe2"/><text x="600" y="146" font-size="23">AI에 전달</text><text x="600" y="178" font-size="17">피드·판매 페이지</text><rect x="730" y="105" width="190" height="100" rx="17" fill="#dcefe2"/><text x="825" y="146" font-size="23">고객 확인</text><text x="825" y="178" font-size="17">비교·구매</text><rect x="955" y="105" width="190" height="100" rx="17" fill="#fae2cb"/><text x="1050" y="146" font-size="23">오류 수정</text><text x="1050" y="178" font-size="17">원장에 반영</text></g>
<g fill="none" stroke="#5f9d71" stroke-width="4"><path d="M250 155h23m-8-8 8 8-8 8"/><path d="M475 155h23m-8-8 8 8-8 8"/><path d="M700 155h23m-8-8 8 8-8 8"/><path d="M925 155h23m-8-8 8 8-8 8"/><path d="M1050 220v80H150v-80" stroke-dasharray="8 7"/></g><text x="390" y="330" font-size="18" font-family="sans-serif" fill="#4d7659">가격·재고는 변합니다. 게시 후에도 계속 맞춰야 합니다.</text></svg>
