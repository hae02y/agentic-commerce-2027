<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">추천을 선택으로 바꾸는 다섯 가지 확인</title><desc id="desc">필수 조건, 전체 비용, 배송과 반품, 불확실성, 결제 직전 확인의 순서.</desc>
<rect width="1200" height="340" rx="24" fill="#f8f6f1"/><text x="50" y="56" font-size="30" font-family="sans-serif" font-weight="700" fill="#5b4528">추천 1위보다 중요한 다섯 가지 확인</text>
<g font-family="sans-serif" text-anchor="middle" fill="#5b4528"><rect x="45" y="105" width="205" height="120" rx="18" fill="#f0e5d4"/><text x="147" y="155" font-size="21">필수 조건</text><text x="147" y="187" font-size="17">어기는 후보 제외</text><rect x="275" y="105" width="205" height="120" rx="18" fill="#f0e5d4"/><text x="377" y="155" font-size="21">전체 비용</text><text x="377" y="187" font-size="17">배송·설치 포함</text><rect x="505" y="105" width="205" height="120" rx="18" fill="#f0e5d4"/><text x="607" y="155" font-size="21">거래 조건</text><text x="607" y="187" font-size="17">배송·반품</text><rect x="735" y="105" width="205" height="120" rx="18" fill="#f0e5d4"/><text x="837" y="155" font-size="21">불확실성</text><text x="837" y="187" font-size="17">모르는 정보 표시</text><rect x="965" y="105" width="190" height="120" rx="18" fill="#e6d5b2"/><text x="1060" y="155" font-size="21">최종 확인</text><text x="1060" y="187" font-size="17">옵션·총액 승인</text></g><path d="M90 270h1020" stroke="#987746" stroke-width="5"/><path d="M1110 270l-17-10v20z" fill="#987746"/><text x="50" y="310" font-size="18" font-family="sans-serif" fill="#6f5834">AI는 근거를 정리하고, 사람은 우선순위와 최종 거래를 결정합니다.</text></svg>
