<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">에이전틱 커머스 90일 도입 계획</title><desc id="desc">1~30일 기준선, 31~60일 제한된 실험, 61~90일 확대 판단의 세 단계다.</desc>
  <rect width="960" height="300" rx="22" fill="#f6f8fc"/>
  <text x="36" y="48" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="25" font-weight="700" fill="#172b4d">90일 동안 작게 시작하고 증거로 결정합니다</text>
  <g font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" text-anchor="middle">
    <rect x="35" y="95" width="275" height="140" rx="18" fill="#d8e8ff"/><text x="172" y="135" font-size="20" font-weight="700" fill="#173e72">1~30일: 기준선</text><text x="172" y="171" font-size="17" fill="#355b85">사용 사례·권한·기존 오류</text><text x="172" y="202" font-size="15" fill="#355b85">산출물: 업무 정의와 승인표</text>
    <rect x="342" y="95" width="275" height="140" rx="18" fill="#d9f2ef"/><text x="479" y="135" font-size="20" font-weight="700" fill="#125b56">31~60일: 실험</text><text x="479" y="171" font-size="17" fill="#33766f">일부 상품·저위험 구매</text><text x="479" y="202" font-size="15" fill="#33766f">산출물: 오류와 성과 기록</text>
    <rect x="649" y="95" width="275" height="140" rx="18" fill="#e8e1fb"/><text x="786" y="135" font-size="20" font-weight="700" fill="#5b3a8e">61~90일: 판단</text><text x="786" y="171" font-size="17" fill="#765a9a">확대·수정·보류 선택</text><text x="786" y="202" font-size="15" fill="#765a9a">산출물: 다음 범위와 책임자</text>
  </g>
</svg>
