<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">AI 쇼핑의 다섯 단계</title><desc id="desc">목적과 조건, 후보 조사, 근거 비교, 사람의 승인, 주문 확인 순서이며 승인부터는 금전적 위험이 커진다.</desc>
<rect width="1200" height="300" rx="24" fill="#f2f7f6"/><text x="50" y="54" font-size="30" font-family="sans-serif" font-weight="700" fill="#173c3b">AI 쇼핑은 어디서 시작하고 끝날까요?</text>
<g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#173c3b">
<rect x="48" y="100" width="190" height="100" rx="18" fill="#d8eee9"/><text x="143" y="140">① 목적·조건</text><text x="143" y="172" font-size="17">사람이 정함</text>
<rect x="276" y="100" width="190" height="100" rx="18" fill="#d8eee9"/><text x="371" y="140">② 후보 조사</text><text x="371" y="172" font-size="17">AI가 도움</text>
<rect x="504" y="100" width="190" height="100" rx="18" fill="#d8eee9"/><text x="599" y="140">③ 근거 비교</text><text x="599" y="172" font-size="17">출처 확인</text>
<rect x="732" y="100" width="190" height="100" rx="18" fill="#ffe4b6"/><text x="827" y="140">④ 구매 승인</text><text x="827" y="172" font-size="17">총액·판매자</text>
<rect x="960" y="100" width="190" height="100" rx="18" fill="#ffe4b6"/><text x="1055" y="140">⑤ 주문 확인</text><text x="1055" y="172" font-size="17">영수증·배송</text>
</g><g fill="#357a72"><path d="M244 148l20 0-8-8m8 8-8 8" stroke="#357a72" stroke-width="4" fill="none"/><path d="M472 148l20 0-8-8m8 8-8 8" stroke="#357a72" stroke-width="4" fill="none"/><path d="M700 148l20 0-8-8m8 8-8 8" stroke="#357a72" stroke-width="4" fill="none"/><path d="M928 148l20 0-8-8m8 8-8 8" stroke="#357a72" stroke-width="4" fill="none"/></g>
<text x="725" y="250" font-size="18" font-family="sans-serif" fill="#815015">← 돈이 움직이는 단계에서는 승인과 기록이 더 중요합니다 →</text></svg>
