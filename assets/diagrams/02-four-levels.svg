<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">에이전틱 커머스 위임의 네 단계</title><desc id="desc">탐색, 비교, 주문 준비, 거래 실행의 네 단계와 단계별 권한의 차이.</desc>
<rect width="1200" height="330" rx="24" fill="#f5f7fc"/><text x="50" y="55" font-size="30" font-family="sans-serif" font-weight="700" fill="#213b62">AI에게 어디까지 맡길까요?</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="50" y="100" width="250" height="145" rx="20" fill="#e2ecfa"/><text x="175" y="148" font-size="25" font-weight="700" fill="#213b62">1 탐색</text><text x="175" y="188" font-size="19" fill="#335477">후보 찾기</text><rect x="330" y="100" width="250" height="145" rx="20" fill="#d2e4f8"/><text x="455" y="148" font-size="25" font-weight="700" fill="#213b62">2 비교</text><text x="455" y="188" font-size="19" fill="#335477">근거 정리</text><rect x="610" y="100" width="250" height="145" rx="20" fill="#fbe6cd"/><text x="735" y="148" font-size="25" font-weight="700" fill="#704312">3 준비</text><text x="735" y="188" font-size="19" fill="#704312">옵션·주소 입력</text><rect x="890" y="100" width="250" height="145" rx="20" fill="#f9d8d4"/><text x="1015" y="148" font-size="25" font-weight="700" fill="#843b34">4 실행</text><text x="1015" y="188" font-size="19" fill="#843b34">주문·결제</text></g>
<path d="M90 280h1040" stroke="#5379ad" stroke-width="5"/><path d="M1130 280l-16-10v20z" fill="#5379ad"/><text x="50" y="310" font-size="18" font-family="sans-serif" fill="#405b7e">권한과 실수 비용이 커집니다. 단계마다 승인과 확인 방법을 정하세요.</text></svg>
