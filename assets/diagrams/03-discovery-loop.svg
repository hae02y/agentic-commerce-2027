<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">대화형 상품 발견의 순환</title><desc id="desc">질문, 조건 구체화, 상품 조사, 근거 비교, 다시 질문 순서로 순환한다.</desc>
<rect width="1200" height="340" rx="24" fill="#f7f5fb"/><text x="50" y="55" font-size="30" font-family="sans-serif" font-weight="700" fill="#473265">검색어 한 줄에서 구매 조건으로</text>
<g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#473265"><rect x="45" y="115" width="200" height="100" rx="18" fill="#e8dcf2"/><text x="145" y="171">막연한 질문</text><rect x="280" y="115" width="200" height="100" rx="18" fill="#e8dcf2"/><text x="380" y="171">조건 구체화</text><rect x="515" y="115" width="200" height="100" rx="18" fill="#e8dcf2"/><text x="615" y="171">상품 조사</text><rect x="750" y="115" width="200" height="100" rx="18" fill="#e8dcf2"/><text x="850" y="171">근거 비교</text><rect x="985" y="115" width="170" height="100" rx="18" fill="#cfe8dc"/><text x="1070" y="171">후보 제시</text></g>
<g fill="none" stroke="#82619e" stroke-width="4"><path d="M250 165h23m-9-9 9 9-9 9"/><path d="M485 165h23m-9-9 9 9-9 9"/><path d="M720 165h23m-9-9 9 9-9 9"/><path d="M955 165h23m-9-9 9 9-9 9"/><path d="M1070 225v58H380v-48" stroke-dasharray="8 7"/></g><text x="504" y="310" font-size="18" font-family="sans-serif" fill="#66527b">조건이 빠졌다면 다시 질문합니다.</text></svg>
